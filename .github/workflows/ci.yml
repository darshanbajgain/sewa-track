# Continuous Integration: runs on every push to main and every pull request.
# If any step fails, the PR shows a red ❌ and should not be merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres 16 next to the job, so integration tests run against a real DB (same as locally).
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sewa
          POSTGRES_PASSWORD: sewa_ci_password
          POSTGRES_DB: sewa_track_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before running the steps.
        options: >-
          --health-cmd "pg_isready -U sewa -d sewa_track_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://sewa:sewa_ci_password@localhost:5432/sewa_track_test

    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail if pnpm-lock.yaml is out of date, so CI installs exactly what we tested.
      - run: pnpm install --frozen-lockfile

      # Fail if any dependency has a known high or critical vulnerability (GitHub advisory database).
      - name: Security audit
        run: pnpm audit --audit-level high

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Build both production images, so a broken Dockerfile fails the PR instead of the deploy.
  # Runs in parallel with `check`. Images are only built here, never pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t sewa-api .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg API_ORIGIN=http://api:4000 -t sewa-web .
